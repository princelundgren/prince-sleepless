name: CodeQL

on:
  push:
    branches: [main]
  # A pull request is scanned only when it touches code CodeQL reads; main and the weekly run scan all.
  pull_request:
    paths:
      - "**/*.swift"
      - PrinceSleepless/project.yml
      - .github/workflows/**
  schedule:
    - cron: "17 5 * * 1"

permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-24.04
          # CodeQL can't trace a build on macOS 27 or with Xcode 27, so this scan stays on Xcode 26.
          - language: swift
            build-mode: manual
            runner: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode and install XcodeGen
        if: matrix.language == 'swift'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          scripts/install-xcodegen.sh >> "$GITHUB_PATH"
      # Autobuild looks for an Xcode project, and this one is generated, so it would scan only the core package.
      - name: Generate the project
        if: matrix.language == 'swift'
        working-directory: PrinceSleepless
        run: xcodegen generate
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      # CodeQL traces a build only under Rosetta, so this builds for x86_64 and no arm64 destination exists.
      - name: Build the app
        if: matrix.language == 'swift'
        working-directory: PrinceSleepless
        run: >-
          xcodebuild -scheme PrinceSleepless -configuration Debug
          -derivedDataPath ../build/DerivedData CODE_SIGNING_ALLOWED=NO build
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
